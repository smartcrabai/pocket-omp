name: pocket-omp-dev

services:
  control-postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    restart: unless-stopped
    ports: ["55434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket -d control"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      POSTGRES_USER: pocket
      POSTGRES_PASSWORD: pocket-dev-only
      POSTGRES_DB: control
    volumes: ["control-postgres:/var/lib/postgresql"]

volumes:
  control-postgres:
