name: pocket-omp-dev

services:
  control-postgres:
    image: postgres:18.6-alpine3.23@sha256:f1031bf693d8d60b0a0380c51a3510607c7a93c7c1d18bf7af94a3a8dbeb40b8
    restart: unless-stopped
    ports: ["55434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket -d control"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      POSTGRES_USER: pocket
      POSTGRES_PASSWORD: pocket-dev-only
      POSTGRES_DB: control
    volumes: ["control-postgres:/var/lib/postgresql"]

volumes:
  control-postgres:
