name: pocket-omp-dev

services:
  control-postgres:
    image: postgres:19.0-alpine3.23@sha256:40ad7e457013448b5522c6c5d30dccb8248959c41adc0e56c1785be4293bbd67
    restart: unless-stopped
    ports: ["55434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket -d control"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      POSTGRES_USER: pocket
      POSTGRES_PASSWORD: pocket-dev-only
      POSTGRES_DB: control
    volumes: ["control-postgres:/var/lib/postgresql"]

volumes:
  control-postgres:
