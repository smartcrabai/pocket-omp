name: pocket-omp-dev

services:
  control-postgres:
    image: postgres:18.7-alpine3.23@sha256:f3ee138d5fce80ffaeb315b8bea7610f0c4f2304fb2aceb4ec8e457b92fc41a0
    restart: unless-stopped
    ports: ["55434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket -d control"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      POSTGRES_USER: pocket
      POSTGRES_PASSWORD: pocket-dev-only
      POSTGRES_DB: control
    volumes: ["control-postgres:/var/lib/postgresql"]

volumes:
  control-postgres:
