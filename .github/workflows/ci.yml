name: Release Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Setup Buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: 1.72.0
          setup_only: true
      - name: Setup Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate contracts
        run: bun run gen
      - name: Verify generated TypeScript
        run: git diff --exit-code -- packages/proto
      - name: Check Protobuf
        run: buf lint
      - name: Check Rust formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Check TypeScript formatting
        run: bun run format:check
      - name: Check architecture
        run: bun run architecture
      - name: Typecheck
        run: bun run typecheck
      - name: Lint Rust
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Lint TypeScript
        run: bun run lint

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Setup Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rust tests
        run: bun run test:rust:unit
      - name: TypeScript tests
        run: bun run test:ts

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Setup Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start production adapters
        run: docker compose up --detach --wait
      - name: Run integration and E2E tests
        run: bun run test:integration
      - name: Collect adapter logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop production adapters
        if: always()
        run: docker compose down --volumes
