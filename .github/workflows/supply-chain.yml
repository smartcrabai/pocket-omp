name: Supply Chain

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Setup Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install audit tools
        run: cargo install --locked cargo-audit cargo-deny
      - name: Audit Rust advisories
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071 # unreachable optional SQLx MySQL lock entry
      - name: Enforce Rust dependency policy
        run: cargo deny check
      - name: Audit Bun dependencies
        # Tooling/optional OMP paths cannot take incompatible transitive majors; they do not process untrusted input in CI.
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high \
            --ignore=GHSA-xcpc-8h2w-3j85 \
            --ignore=GHSA-mh99-v99m-4gvg \
            --ignore=GHSA-f88m-g3jw-g9cj

  sbom:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Relay image
        run: docker build --file infra/docker/relay.Dockerfile --tag pocket-omp-relay:${{ github.sha }} .
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: pocket-omp-relay:${{ github.sha }}
          format: spdx-json
          output-file: relay.spdx.json
      - name: Export release image and checksums
        run: |
          docker save pocket-omp-relay:${{ github.sha }} --output relay.oci.tar
          sha256sum relay.oci.tar relay.spdx.json > SHA256SUMS
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign SBOM keylessly
        run: cosign sign-blob --yes --bundle relay.spdx.bundle relay.spdx.json
      - name: Sign release checksums keylessly
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: |
            relay.oci.tar
            relay.spdx.json
            relay.spdx.bundle
            SHA256SUMS
            SHA256SUMS.sigstore.json
          if-no-files-found: error
          retention-days: 90
