name: Supply Chain

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit Bun dependencies
        run: |
          bun audit --audit-level=high \
            --ignore=GHSA-xcpc-8h2w-3j85 \
            --ignore=GHSA-mh99-v99m-4gvg \
            --ignore=GHSA-f88m-g3jw-g9cj
      - name: Build Worker artifact
        run: bunx wrangler deploy --dry-run --outdir dist --config wrangler.jsonc

  sbom:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: pocket-omp.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign SBOM keylessly
        run: cosign sign-blob --yes --bundle pocket-omp.spdx.bundle pocket-omp.spdx.json
      - name: Upload signed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: |
            pocket-omp.spdx.json
            pocket-omp.spdx.bundle
          if-no-files-found: error
          retention-days: 90
